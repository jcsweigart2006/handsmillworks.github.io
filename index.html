<style type="text/css">body{line-height:1.6;font-size:18px;color:#d8d1bb;background-color: #2e2412;}h1,h2,h3{line-height:1.2}
text-align:center;
.logo {
  display: flex;
  justify-content: center;
}
}
.container {
  padding: 2rem;
}
.slider-wrapper {
  position: relative;
  max-width: 48rem;
  margin: 0 auto;
}
.slider {
  display: flex;
  aspect-ratio: 16 / 9;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  box-shadow: 0 1.5rem 3rem -0.75rem hsla(0, 0%, 0%, 0.25);
  border-radius: 0.5rem;
}
.slider img {
  flex: 1 0 %100;
  scroll-snap-align: start;
  object-fit: cover;
  border-radius: 50px;
}
.slider-nav {
  display: flex;
  column-gap: 1rem;
  position: absolute;
  bottom: 1.25rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
}
.slider-nav a {
  width: 0.5rem;
  height: 0.5rem;
  border-radious: 50%;
  background-color: #fff;
  opacity: 0.75;
  transition: opacity ease 250ms;
}
.slider-nav a:hover {
  opacity: 1;
}
.contact-container{
  height: 100vh;
  display; flex;
  align-items: center;
  justify-content: space-evenly;
}
.contact-column{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.contact-column-title h2{
  font-weight: 600;
  color: #d8d1bb;
  font-size: 40px;
  margin-bottom: 5px;
}
.contact-column-title hr{
  border: none;
  width: 120px;
  height: 5px;
  background-color: #d8d1bb;
  border-radius: 10px;
  margin-bottom: 20px;
}
.contact-inputs{
  width: 400px;
  height: 50px;
  border: none;
  outline: none;
  font-weight: 500;
  border-radius: 50px;
}
.contact-column textarea{
  height: 140px;
  padding-top: 15px;
  border-radius: 20px;
}
.contact-inputs:focus{
  border: 2px solid #d8d1bb;
}
.contact-inputs::placeholder{
  color: #a9a9a9;
}
.contact-column button{
  display: flex;
  align-items: center;
  padding: 15px 30px;
  font-side: 16px;
  gap: 10px;
  border: none;
  border-radius: 50px;
}
</style>
